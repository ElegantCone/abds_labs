server.port=${APP_PORT:8080}
spring.datasource.url=jdbc:clickhouse:http://${CLICKHOUSE_HOST:localhost}:${CLICKHOUSE_HTTP_PORT:8123}/${CLICKHOUSE_DATABASE:energosbyt}
spring.datasource.username=${CLICKHOUSE_USER:default}
spring.datasource.password=${CLICKHOUSE_PASSWORD:}
spring.datasource.hikari.data-source-properties.password=${CLICKHOUSE_PASSWORD:}
spring.datasource.driver-class-name=com.clickhouse.jdbc.ClickHouseDriver
